services:
  mongo:
    image: mongo:8
    container_name: mycardstrader-mongo-e2e
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_e2e_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo_e2e_data:
