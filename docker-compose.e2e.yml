name: mycardstrader-e2e
services:
  mongo:
    image: mongo:8
    container_name: mycardstrader-mongo-e2e
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - mongo_e2e_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  runner:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - e2e_node_modules:/app/node_modules
    environment:
      NODE_ENV: test
      BATCH_E2E_MONGO_URI: mongodb://mongo:27017/card_batch_e2e?replicaSet=rs0&directConnection=true
      CARD_SCAN_STORAGE_ENDPOINT: http://minio:9000
      CARD_SCAN_STORAGE_ACCESS_KEY_ID: mycardstrader-e2e
      CARD_SCAN_STORAGE_SECRET_ACCESS_KEY: mycardstrader-e2e-secret
    depends_on:
      mongo:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: ["sh", "-c", "npm ci && npm run test:e2e -- --runInBand"]
    profiles: ["test"]

  minio:
    image: bitnamilegacy/minio@sha256:a26e42a4d6550d2fb7708c8ceefc60474b42c124b6f3273a081721ddf1d86b20
    environment:
      MINIO_ROOT_USER: mycardstrader-e2e
      MINIO_ROOT_PASSWORD: mycardstrader-e2e-secret
    ports:
      - "9010:9000"
      - "9011:9001"
    volumes:
      - minio_e2e_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 mycardstrader-e2e mycardstrader-e2e-secret &&
        mc mb --ignore-existing local/card-scan-dataset &&
        mc anonymous set none local/card-scan-dataset

volumes:
  mongo_e2e_data:
  e2e_node_modules:
  minio_e2e_data:
