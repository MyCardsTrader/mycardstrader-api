services:
  mongo:
    image: mongo:8
    container_name: mycardstrader-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-seed:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/foils.json:/seed/foils.json:ro
    command:
      - mongoimport
      - --uri=mongodb://mongo:27017/mycardstrader?directConnection=true
      - --collection=foils
      - --file=/seed/foils.json
      - --jsonArray
      - --mode=upsert
      - --upsertFields=_id

volumes:
  mongo_data:
