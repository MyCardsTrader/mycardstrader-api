services:
  mongo:
    image: mongo:8
    container_name: mycardstrader-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }; if (!db.hello().isWritablePrimary) quit(1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-seed:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./docker/mongo/foils.json:/seed/foils.json:ro
    command:
      - mongoimport
      - --uri=mongodb://mongo:27017/mycardstrader?directConnection=true
      - --collection=foils
      - --file=/seed/foils.json
      - --jsonArray
      - --mode=upsert
      - --upsertFields=_id

  minio:
    image: bitnamilegacy/minio@sha256:a26e42a4d6550d2fb7708c8ceefc60474b42c124b6f3273a081721ddf1d86b20
    container_name: mycardstrader-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: mycardstrader
      MINIO_ROOT_PASSWORD: mycardstrader-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: bitnamilegacy/minio-client@sha256:00dcc4e58ada0df45bb7d9ee435af98295f96c27c3c68292ce78ec700a87b511
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 mycardstrader mycardstrader-local-secret &&
        mc mb --ignore-existing local/card-scan-dataset &&
        mc anonymous set none local/card-scan-dataset

volumes:
  mongo_data:
  minio_data:
